name: env-memdoc
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # Core
    - numpy
    - pandas
    - datasets
    - huggingface_hub
    - python-dotenv
    - tqdm
    - pydantic
    - backoff
    # Agents / RAG
    - langchain-core
    - langchain-text-splitters
    - langchain-classic
    - langchain-community
    - langchain-chroma
    - langchain-groq
    - langchain-openai
    - langgraph
    - chromadb
    - tiktoken
    - rank-bm25
    - onnxruntime
    - mempalace
    # Notebooks / plots
    - matplotlib
    - seaborn
    - jupyter
    # Tests
    - pytest
